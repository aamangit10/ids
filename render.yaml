services:
  # -------------------------------------------------------------
  # Backend API Service (FastAPI, PyTorch & Scikit-Learn IDS)
  # -------------------------------------------------------------
  - type: web
    name: ids-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000

  # -------------------------------------------------------------
  # Frontend Dashboard UI (React 18 + Vite + Tailwind/Lucide)
  # -------------------------------------------------------------
  - type: static
    name: ids-frontend
    runtime: static
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ids-backend
          property: host

