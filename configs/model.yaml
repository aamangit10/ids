# Model Configuration for Explainable SSL Transformer-Based IDS

data:
  csv_mode:
    target_column: "Label"
    binary_benign_label: "BENIGN"
    test_size: 0.2
    random_state: 42
    remove_columns:
      - "Flow ID"
      - "Source IP"
      - "Source Port"
      - "Destination IP"
      - "Destination Port"
      - "Timestamp"
      - "Unnamed: 0"
  
  packet_mode:
    max_seq_len: 32
    features_per_packet: 5  # [length, protocol, flags, iat, direction]
    batch_size: 64
    num_workers: 0

baselines:
  logistic_regression:
    max_iter: 1000
    solver: "lbfgs"
    random_state: 42
  random_forest:
    n_estimators: 100
    max_depth: 15
    random_state: 42
    n_jobs: -1
  xgboost:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 6
    random_state: 42

transformer:
  max_seq_len: 32
  features_dim: 5
  embed_dim: 256
  nhead: 4
  num_layers: 4
  dim_feedforward: 512
  dropout: 0.1
  learning_rate: 0.0005
  epochs: 15
  batch_size: 64

ssl_contrastive:
  temperature: 0.07
  projection_dim: 128
  learning_rate: 0.001
  epochs: 20
  augmentation_mask_prob: 0.15
  augmentation_jitter_std: 0.05
